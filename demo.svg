<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13">
  <style>
    .t { fill: #e6edf3; }
    .dim { fill: #8b949e; }
    .hl { fill: #e3b341; }
    .p { fill: #7ee787; }
    .k { fill: #79c0ff; }
    .s { fill: #a5d6ff; }
    .n { fill: #ffa657; }
    .g { fill: #7ee787; }

    .scene { animation: scene 18s linear infinite; }
    @keyframes scene { 0%, 93% { opacity: 1; } 97%, 100% { opacity: 0; } }

    /* covers are invisible unless animations run, so static renderers show the full frame */
    .cover { fill: #0d1117; opacity: 0; }
    .type1 { animation: type1 18s infinite; }
    @keyframes type1 {
      0% { opacity: 1; transform: translateX(0); }
      2.2% { opacity: 1; transform: translateX(0); animation-timing-function: steps(37, end); }
      12.2%, 100% { opacity: 1; transform: translateX(310px); }
    }
    .type2 { animation: type2 18s infinite; }
    @keyframes type2 {
      0% { opacity: 1; transform: translateX(0); }
      25% { opacity: 1; transform: translateX(0); animation-timing-function: steps(61, end); }
      41.7%, 100% { opacity: 1; transform: translateX(505px); }
    }
    .cmd2g { animation: cmd2g 18s linear infinite; }
    @keyframes cmd2g { 0%, 24.8% { opacity: 0; } 25%, 100% { opacity: 1; } }

    .cfg { animation: cfg 18s linear infinite; }
    @keyframes cfg { 0%, 13.5% { opacity: 0; } 15%, 100% { opacity: 1; } }

    .r0 { animation: r0 18s linear infinite; }
    @keyframes r0 { 0%, 43.5% { opacity: 0; } 44.3%, 100% { opacity: 1; } }
    .r1 { animation: r1 18s linear infinite; }
    @keyframes r1 { 0%, 45.3% { opacity: 0; } 46.1%, 100% { opacity: 1; } }
    .r2 { animation: r2 18s linear infinite; }
    @keyframes r2 { 0%, 47.1% { opacity: 0; } 47.9%, 100% { opacity: 1; } }
    .r3 { animation: r3 18s linear infinite; }
    @keyframes r3 { 0%, 48.9% { opacity: 0; } 49.7%, 100% { opacity: 1; } }
    .r4 { animation: r4 18s linear infinite; }
    @keyframes r4 { 0%, 50.7% { opacity: 0; } 51.5%, 100% { opacity: 1; } }
    .r5 { animation: r5 18s linear infinite; }
    @keyframes r5 { 0%, 52.5% { opacity: 0; } 53.3%, 100% { opacity: 1; } }
    .r6 { animation: r6 18s linear infinite; }
    @keyframes r6 { 0%, 54.3% { opacity: 0; } 55.1%, 100% { opacity: 1; } }

    .ann { animation: ann 18s linear infinite; }
    @keyframes ann { 0%, 58% { opacity: 0; } 59.5%, 100% { opacity: 1; } }

    .curg { animation: ann 18s linear infinite; }
    .cur { animation: blink 1s steps(2, jump-none) infinite; fill: #e6edf3; }
    @keyframes blink { 0% { opacity: 1; } 100% { opacity: 0; } }
  </style>

  <rect width="880" height="450" rx="10" fill="#0d1117" stroke="#30363d"/>
  <path d="M0 10 a10 10 0 0 1 10 -10 h860 a10 10 0 0 1 10 10 v26 h-880 z" fill="#161b22"/>
  <circle cx="22" cy="18" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="18" r="6" fill="#febc2e"/>
  <circle cx="62" cy="18" r="6" fill="#28c840"/>
  <text x="440" y="22" text-anchor="middle" class="dim" font-size="12">fitter — declarative config → structured JSON</text>

  <g class="scene">
    <text x="24" y="64"><tspan class="p">$ </tspan><tspan class="t">cat examples/config_conditions.json</tspan></text>
    <rect class="cover type1" x="38" y="50" width="320" height="19"/>

    <g class="cfg">
      <text x="24" y="85" class="dim">{</text>
      <text x="40" y="106" class="dim">"connector_config": { "url": "https://dummyjson.com/products?limit=10" },</text>
      <text x="40" y="127" class="dim">"model": { "array_config": {</text>
      <text x="56" y="148" class="dim">"root_path": "products",</text>
      <text x="56" y="169" class="hl">"item_condition": "fSrc.rating &gt;= 4 &amp;&amp; fRes.price &gt; 0",</text>
      <text x="56" y="190"><tspan class="dim">"item_config": { … </tspan><tspan class="hl">"discount_pct": { "condition": "fRes &gt;= 10" }</tspan><tspan class="dim"> … }</tspan></text>
      <text x="24" y="211" class="dim">} } }</text>
    </g>

    <g class="cmd2g">
      <text x="24" y="243"><tspan class="p">$ </tspan><tspan class="t">fitter_cli --path=examples/config_conditions.json --pretty</tspan></text>
    </g>
    <rect class="cover type2" x="38" y="229" width="520" height="19"/>

    <text class="r0 t" x="24" y="264">[</text>
    <text class="r1" x="40" y="285"><tspan class="t">{ </tspan><tspan class="k">"title"</tspan><tspan class="t">: </tspan><tspan class="s">"Powder Canister"</tspan><tspan class="t">, </tspan><tspan class="k">"price"</tspan><tspan class="t">: </tspan><tspan class="n">14.99</tspan><tspan class="t"> },</tspan></text>
    <text class="r2" x="40" y="306"><tspan class="t">{ </tspan><tspan class="k">"title"</tspan><tspan class="t">: </tspan><tspan class="s">"Red Lipstick"</tspan><tspan class="t">, </tspan><tspan class="k">"price"</tspan><tspan class="t">: </tspan><tspan class="n">12.99</tspan><tspan class="t">, </tspan><tspan class="k">"discount_pct"</tspan><tspan class="t">: </tspan><tspan class="g">12.16</tspan><tspan class="t"> },</tspan></text>
    <text class="r3" x="40" y="327"><tspan class="t">{ </tspan><tspan class="k">"title"</tspan><tspan class="t">: </tspan><tspan class="s">"Red Nail Polish"</tspan><tspan class="t">, </tspan><tspan class="k">"price"</tspan><tspan class="t">: </tspan><tspan class="n">8.99</tspan><tspan class="t">, </tspan><tspan class="k">"discount_pct"</tspan><tspan class="t">: </tspan><tspan class="g">11.44</tspan><tspan class="t"> },</tspan></text>
    <text class="r4" x="40" y="348"><tspan class="t">{ </tspan><tspan class="k">"title"</tspan><tspan class="t">: </tspan><tspan class="s">"Calvin Klein CK One"</tspan><tspan class="t">, </tspan><tspan class="k">"price"</tspan><tspan class="t">: </tspan><tspan class="n">49.99</tspan><tspan class="t"> },</tspan></text>
    <text class="r5" x="40" y="369"><tspan class="t">{ </tspan><tspan class="k">"title"</tspan><tspan class="t">: </tspan><tspan class="s">"Chanel Coco Noir Eau De"</tspan><tspan class="t">, </tspan><tspan class="k">"price"</tspan><tspan class="t">: </tspan><tspan class="n">129.99</tspan><tspan class="t">, </tspan><tspan class="k">"discount_pct"</tspan><tspan class="t">: </tspan><tspan class="g">16.51</tspan><tspan class="t"> }</tspan></text>
    <text class="r6 t" x="24" y="390">]</text>

    <text class="ann dim" x="24" y="418" font-style="italic">5 of 10 kept — filtered on fSrc.rating without extracting it; discount_pct omitted where &lt; 10</text>

    <g class="curg"><rect class="cur" x="24" y="425" width="8" height="15"/></g>
  </g>
</svg>
